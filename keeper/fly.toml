# Batpilot keeper on Fly.io — ONE app watching all chains via WATCH env.
# Secrets: fly secrets set PRIVATE_KEY=... WATCH="testnet:46630:<vault>:<rpc>,mainnet:4663:<vault>:<rpc>" INTERVAL_MS=...
# Deploy: fly deploy
app = "batpilot-keeper"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  INTERVAL_MS = "30000"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[processes]
  app = "node dist/index.js"

[[restart]]
  policy = "always"
