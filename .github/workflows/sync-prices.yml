name: sync-demo-prices

# Pushes free Yahoo Finance quotes into the testnet mock feeds every 5 minutes
# so the demo market moves with reality. Secrets (repo Settings → Secrets):
#   TESTNET_KEY — keeper key (only ever touches permissionless mock setPrice)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: keeper-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p $RUNNER_TEMP/sync && cd $RUNNER_TEMP/sync && npm init -y >/dev/null && npm install viem && cp $GITHUB_WORKSPACE/keeper-worker/scripts/sync-prices.mjs .
      - run: cd $RUNNER_TEMP/sync && node sync-prices.mjs
        env:
          TESTNET_KEY: ${{ secrets.TESTNET_KEY }}
